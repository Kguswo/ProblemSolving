name: Organize CF folders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move numeric contest folders into Codeforces/
        run: |
          mkdir -p Codeforces
          moved=false
          for d in */; do
            name="${d%/}"
            if [[ "$name" =~ ^[0-9]+$ ]]; then
              git mv "$name" "Codeforces/$name"
              moved=true
            fi
          done
          echo "moved=$moved" >> "$GITHUB_ENV"

      - name: Move CFPusher-generated README into Codeforces/, restore root README
        run: |
          restored=false
          if [ -f README.md ] && grep -q "Auto-generated by CFPusher" README.md; then
            mv README.md Codeforces/README.md
            cp .github/root-readme-template.md README.md
            restored=true
          fi
          echo "restored=$restored" >> "$GITHUB_ENV"

      - name: Commit changes
        run: |
          if [ "$moved" = "true" ] || [ "$restored" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: organize CF folders and README [skip ci]"
            git push
          else
            echo "Nothing to organize"
          fi
