name: Organize CF folders

on:
  push:
    branches: [main]

concurrency:
  group: organize-cf
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Debounce (연속 push가 끝날 때까지 대기)
        run: sleep 20

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize folders and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p Codeforces
          moved=false
          for d in */; do
            name="${d%/}"
            if [[ "$name" =~ ^[0-9]+$ ]]; then
              git mv "$name" "Codeforces/$name"
              moved=true
            fi
          done

          restored=false
          if [ -f README.md ] && grep -q "CFPusher" README.md; then
            mv README.md Codeforces/README.md
            cp .github/root-readme-template.md README.md
            restored=true
          fi

          if [ "$moved" = "false" ] && [ "$restored" = "false" ]; then
            echo "Nothing to organize"
            exit 0
          fi

          git add -A
          git commit -m "chore: organize CF folders and README [skip ci]"

          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, resetting to latest and retrying ($i/3)..."
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done
